<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VELORA — Velocity & Motion</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300f5d4'/%3E%3Cstop offset='50%25' stop-color='%2372009f'/%3E%3Cstop offset='100%25' stop-color='%23f15bb5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Cpath d='M50 15 L50 35 M50 65 L50 85 M15 50 L35 50 M65 50 L85 50 M28 28 L42 42 M58 58 L72 72 M28 72 L42 58 M58 42 L72 28' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='8' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- INTRO SCREEN -->
    <div id="intro-screen">
        <div class="intro-bg">
            <div class="intro-particle"></div>
            <div class="intro-particle"></div>
            <div class="intro-particle"></div>
            <div class="intro-particle"></div>
            <div class="intro-particle"></div>
            <div class="intro-particle"></div>
            <div class="intro-particle"></div>
            <div class="intro-particle"></div>
        </div>
        <div class="intro-content">
            <div class="intro-logo-wrap">
                <svg class="intro-logo" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="logoG" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f5d4"/>
                            <stop offset="50%" stop-color="#72009f"/>
                            <stop offset="100%" stop-color="#f15bb5"/>
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#logoG)" stroke-width="5" class="intro-logo-ring"/>
                    <path d="M50 18 L50 36 M50 64 L50 82 M18 50 L36 50 M64 50 L82 50 M30 30 L42 42 M58 58 L70 70 M30 70 L42 58 M58 42 L70 30" stroke="url(#logoG)" stroke-width="3.5" stroke-linecap="round" class="intro-logo-spokes"/>
                    <circle cx="50" cy="50" r="7" fill="url(#logoG)" class="intro-logo-center"/>
                </svg>
            </div>
            <h1 class="intro-title">
                <span class="intro-letter">V</span><span class="intro-letter">E</span><span class="intro-letter">L</span><span class="intro-letter">O</span><span class="intro-letter">R</span><span class="intro-letter">A</span>
            </h1>
            <p class="intro-subtitle">Velocity & Motion Tracker</p>
            <div class="intro-tagline">Measure Speed. Track Distance. Feel the Rush.</div>
            <div class="intro-loader">
                <div class="intro-loader-bar"></div>
            </div>
            <button class="intro-enter" onclick="enterApp()">
                <span>Enter Experience</span>
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" style="display:none;">
        <!-- Ambient Background -->
        <div class="ambient-bg">
            <div class="ambient-orb orb-1"></div>
            <div class="ambient-orb orb-2"></div>
            <div class="ambient-orb orb-3"></div>
        </div>
        
        <!-- Noise Texture Overlay -->
        <div class="noise-overlay"></div>

        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <svg class="header-icon" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f5d4"/>
                            <stop offset="100%" stop-color="#f15bb5"/>
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#hG)" stroke-width="5"/>
                    <circle cx="50" cy="50" r="6" fill="url(#hG)"/>
                    <path d="M50 15 L50 30 M50 70 L50 85 M15 50 L30 50 M70 50 L85 50" stroke="url(#hG)" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="header-text">VELORA</span>
            </div>
            <div class="header-gps" id="gps-status">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"/><circle cx="12" cy="9" r="2.5" fill="#0a0a0f"/></svg>
                <span id="gps-text">Locating...</span>
            </div>
        </header>

        <!-- Mode Toggle -->
        <div class="mode-toggle">
            <div class="mode-track">
                <button class="mode-btn active" data-mode="vehicle" onclick="switchMode('vehicle')">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z" fill="currentColor"/></svg>
                    <span>Vehicle</span>
                </button>
                <button class="mode-btn" data-mode="jogging" onclick="switchMode('jogging')">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7" fill="currentColor"/></svg>
                    <span>Jogging</span>
                </button>
                <div class="mode-indicator"></div>
            </div>
        </div>

        <!-- VEHICLE MODE -->
        <div class="mode-panel" id="vehicle-panel">
            <div class="speedo-container">
                <div class="speedo-ring-wrap">
                    <svg class="speedo-svg" viewBox="0 0 300 300">
                        <defs>
                            <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00f5d4"/>
                                <stop offset="50%" stop-color="#00bbf9"/>
                                <stop offset="100%" stop-color="#f15bb5"/>
                            </linearGradient>
                            <filter id="speedGlow">
                                <feGaussianBlur stdDeviation="4" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                        </defs>
                        <!-- Background arc -->
                        <path d="M 60 240 A 120 120 0 1 1 240 240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12" stroke-linecap="round"/>
                        <!-- Progress arc -->
                        <path id="vehicle-arc" d="M 60 240 A 120 120 0 0 1 60 240" fill="none" stroke="url(#speedGrad)" stroke-width="12" stroke-linecap="round" filter="url(#speedGlow)" class="speedo-arc"/>
                        <!-- Tick marks -->
                        <g id="vehicle-ticks"></g>
                        <!-- Labels -->
                        <g id="vehicle-labels"></g>
                    </svg>
                    <div class="speedo-center">
                        <div class="speedo-value" id="vehicle-speed">0</div>
                        <div class="speedo-unit">km/h</div>
                        <div class="speedo-label">Current Speed</div>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="vehicle-max">0</div>
                        <div class="stat-label">Max Speed</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="vehicle-dist">0.00</div>
                        <div class="stat-label">Distance (km)</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" fill="currentColor"/></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="vehicle-time">00:00</div>
                        <div class="stat-label">Duration</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="vehicle-avg">0</div>
                        <div class="stat-label">Avg Speed</div>
                    </div>
                </div>
            </div>

            <div class="control-bar">
                <button class="ctrl-btn primary" id="vehicle-start" onclick="toggleVehicle()">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
                    <span>Start Tracking</span>
                </button>
                <button class="ctrl-btn secondary" onclick="resetVehicle()">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
                    <span>Reset</span>
                </button>
            </div>
        </div>

        <!-- JOGGING MODE -->
        <div class="mode-panel hidden" id="jogging-panel">
            <div class="jog-hero">
                <div class="jog-ring-wrap">
                    <svg class="jog-svg" viewBox="0 0 280 280">
                        <defs>
                            <linearGradient id="jogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f15bb5"/>
                                <stop offset="50%" stop-color="#fee440"/>
                                <stop offset="100%" stop-color="#00f5d4"/>
                            </linearGradient>
                            <filter id="jogGlow">
                                <feGaussianBlur stdDeviation="5" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                        </defs>
                        <circle cx="140" cy="140" r="120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="14"/>
                        <circle id="jog-progress" cx="140" cy="140" r="120" fill="none" stroke="url(#jogGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="754" transform="rotate(-90 140 140)" filter="url(#jogGlow)"/>
                        <circle cx="140" cy="140" r="90" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
                    </svg>
                    <div class="jog-center">
                        <div class="jog-distance" id="jog-dist">0.00</div>
                        <div class="jog-unit">km</div>
                        <div class="jog-label">Distance</div>
                    </div>
                </div>
            </div>

            <div class="jog-stats-row">
                <div class="jog-stat">
                    <div class="jog-stat-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" fill="currentColor"/></svg>
                    </div>
                    <div class="jog-stat-value" id="jog-time">00:00:00</div>
                    <div class="jog-stat-label">Duration</div>
                </div>
                <div class="jog-stat">
                    <div class="jog-stat-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7" fill="currentColor"/></svg>
                    </div>
                    <div class="jog-stat-value" id="jog-pace">--:--</div>
                    <div class="jog-stat-label">Pace /km</div>
                </div>
                <div class="jog-stat">
                    <div class="jog-stat-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/></svg>
                    </div>
                    <div class="jog-stat-value" id="jog-cal">0</div>
                    <div class="jog-stat-label">Calories</div>
                </div>
            </div>

            <div class="jog-pace-chart">
                <div class="chart-header">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z" fill="currentColor"/></svg>
                    <span>Live Pace Graph</span>
                </div>
                <div class="chart-canvas-wrap">
                    <canvas id="paceCanvas" width="400" height="120"></canvas>
                </div>
            </div>

            <div class="control-bar">
                <button class="ctrl-btn jog-primary" id="jog-start" onclick="toggleJogging()">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
                    <span>Start Run</span>
                </button>
                <button class="ctrl-btn secondary" onclick="resetJogging()">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
                    <span>Reset</span>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>VELORA uses GPS for real-time tracking</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
